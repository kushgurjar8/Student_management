<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a3df5"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft glow blobs -->
  <circle cx="200" cy="150" r="300" fill="url(#glow)"/>
  <circle cx="1400" cy="750" r="350" fill="url(#glow)"/>
  <circle cx="1300" cy="200" r="200" fill="url(#glow)"/>

  <!-- faint large circles for depth -->
  <circle cx="120" cy="780" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="1500" cy="120" r="110" fill="#ffffff" opacity="0.06"/>

  <!-- Graduation cap -->
  <g transform="translate(180,120)" opacity="0.9">
    <polygon points="0,40 140,0 280,40 140,80" fill="#ffffff" opacity="0.9"/>
    <rect x="120" y="40" width="40" height="55" fill="#ffffff" opacity="0.85"/>
    <circle cx="140" cy="95" r="10" fill="#ffd23f"/>
    <line x1="260" y1="40" x2="260" y2="100" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <circle cx="260" cy="105" r="6" fill="#ffd23f"/>
  </g>

  <!-- Open book -->
  <g transform="translate(1120,600)" opacity="0.9">
    <path d="M0,20 C60,-10 120,-10 160,20 L160,120 C120,90 60,90 0,120 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M160,20 C200,-10 260,-10 320,20 L320,120 C260,90 200,90 160,120 Z" fill="#ffffff" opacity="0.75"/>
    <line x1="20" y1="40" x2="140" y2="18" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
    <line x1="20" y1="60" x2="140" y2="38" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
    <line x1="180" y1="18" x2="300" y2="40" stroke="#a855f7" stroke-width="3" opacity="0.4"/>
    <line x1="180" y1="38" x2="300" y2="60" stroke="#a855f7" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Pencil -->
  <g transform="translate(1350,420) rotate(35)" opacity="0.85">
    <rect x="0" y="0" width="18" height="140" fill="#ffd23f"/>
    <polygon points="0,140 18,140 9,165" fill="#e8b93a"/>
    <rect x="0" y="0" width="18" height="20" fill="#ffffff"/>
    <rect x="0" y="-14" width="18" height="14" fill="#f97373"/>
  </g>

  <!-- Laptop -->
  <g transform="translate(260,620)" opacity="0.85">
    <rect x="0" y="0" width="220" height="140" rx="10" fill="#ffffff" opacity="0.9"/>
    <rect x="14" y="14" width="192" height="112" rx="4" fill="#6a3df5" opacity="0.6"/>
    <rect x="-20" y="140" width="260" height="18" rx="8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- small floating dots -->
  <circle cx="700" cy="100" r="6" fill="#ffffff" opacity="0.5"/>
  <circle cx="760" cy="160" r="4" fill="#ffffff" opacity="0.4"/>
  <circle cx="950" cy="760" r="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="500" cy="820" r="5" fill="#ffffff" opacity="0.4"/>
</svg>
